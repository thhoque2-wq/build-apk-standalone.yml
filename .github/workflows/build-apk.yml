          rm -f /tmp/droidstream-source.tar.gz.b64
          echo "Embedded source extracted. Files: $(find app/src/main -type f | wc -l)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK (avoid obsolete 'tools' package)
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [[ -z "${SDKMANAGER:-}" || ! -x "$SDKMANAGER" ]]; then
            echo "ERROR: Android sdkmanager was not found under $ANDROID_HOME/cmdline-tools." >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Validate recreated project
        shell: bash
        run: |
          set -euo pipefail
          for file in settings.gradle.kts build.gradle.kts gradle.properties app/build.gradle.kts app/src/main/AndroidManifest.xml; do
            test -s "$file" || { echo "Missing required project file: $file" >&2; exit 1; }
          done
          test "$(find app/src/main/java -type f -name '*.kt' | wc -l)" -gt 0
          echo "Project validation passed."

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          if [[ -z "$APK_PATH" || ! -s "$APK_PATH" ]]; then
            echo "ERROR: APK was not generated." >&2
            find app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi
          mkdir -p out
          cp "$APK_PATH" out/DroidStreamStudio-debug.apk
          sha256sum out/DroidStreamStudio-debug.apk | tee out/SHA256SUMS.txt
          echo "APK generated: out/DroidStreamStudio-debug.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidStreamStudio-debug-APK
          path: |
            out/DroidStreamStudio-debug.apk
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DroidStreamStudio-build-reports
          path: |
            app/build/reports/tests/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
