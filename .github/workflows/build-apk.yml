      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Make sure the debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK
        working-directory: proj/DroidStreamStudio
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp proj/DroidStreamStudio/app/build/outputs/apk/release/*.apk out/DroidStreamStudio.apk
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidStreamStudio-APK
          path: out/DroidStreamStudio.apk
          if-no-files-found: error
