name: Build DroidStream Studio APK (Single YAML)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: droidstream-single-yaml-${{ github.ref }}
  cancel-in-progress: true

